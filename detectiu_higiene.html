<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detectiu d'higiene alimentària</title>
<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#16303d;--mute:#5b7482;--line:#cbd9e1;--brand:#0e6e8c;--ok:#1b7f4b;--okbg:#dff3e7;--ko:#b3261e;--kobg:#fbe3e1;--warn:#9a5b00;--warnbg:#fdf0d5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1e26;--card:#182b36;--ink:#e6f0f5;--mute:#93aebb;--line:#2b4655;--brand:#4fc3e3;--ok:#5fd394;--okbg:#153a28;--ko:#ff8a80;--kobg:#42201e;--warn:#f5c26b;--warnbg:#3d2f10}}
:root[data-theme="dark"]{--bg:#0f1e26;--card:#182b36;--ink:#e6f0f5;--mute:#93aebb;--line:#2b4655;--brand:#4fc3e3;--ok:#5fd394;--okbg:#153a28;--ko:#ff8a80;--kobg:#42201e;--warn:#f5c26b;--warnbg:#3d2f10}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;line-height:1.45}
main{max-width:860px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.7rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 16px}
nav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
nav button{flex:1;min-width:150px;padding:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
nav button[aria-selected="true"]{border-color:var(--brand);background:var(--brand);color:#fff}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.bar{display:flex;justify-content:space-between;color:var(--mute);font-size:.95rem;margin-bottom:8px}
.big{font-size:5.5rem;text-align:center;line-height:1.1;margin:6px 0}
.q{font-size:1.25rem;font-weight:700;text-align:center;margin:0 0 14px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opts button{padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer}
.opts button:disabled{cursor:default}
.fb{margin-top:14px;display:grid;gap:8px}
.fb div{padding:10px 12px;border-radius:10px;border-left:6px solid var(--line);background:var(--bg)}
.fb .good{background:var(--okbg);border-color:var(--ok)}
.fb .bad{background:var(--kobg);border-color:var(--ko)}
.fb .miss{background:var(--warnbg);border-color:var(--warn)}
.verdict{font-weight:700;font-size:1.1rem}
.next{margin-top:14px;padding:12px 22px;border:0;border-radius:12px;background:var(--brand);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;text-align:center}
.tile .e{font-size:2.6rem;line-height:1}
.tile .t{font-size:.92rem}
.tile[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand) inset}
.tile.good{background:var(--okbg);border-color:var(--ok)}
.tile.bad{background:var(--kobg);border-color:var(--ko)}
.tile.miss{background:var(--warnbg);border-color:var(--warn)}
.tile .r{font-size:.82rem;color:var(--ink);margin-top:2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:.9rem;color:var(--mute)}
.end{text-align:center;padding:20px 0}
.end .big{font-size:4rem}
.two{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
.col{display:grid;gap:8px;align-content:start}
.m{padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;text-align:left}
.m.sm{font-weight:400;font-size:.93rem}
.m[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand) inset}
.m.good{background:var(--okbg);border-color:var(--ok);cursor:default}
.m.bad{background:var(--kobg);border-color:var(--ko)}
</style>
</head>
<body>
<main>
<h1>🕵️ Detectiu d'higiene alimentària</h1>
<p class="sub">Dos jocs per repassar la unitat. Després de cada resposta veuràs per què les altres opcions són incorrectes.</p>
<nav role="tablist">
<button role="tab" id="t1" aria-selected="true">1 · Classifica l'aliment</button>
<button role="tab" id="t2" aria-selected="false">2 · Troba els errors a la cuina</button>
<button role="tab" id="t3" aria-selected="false">3 · Relaciona sigles i definicions</button>
</nav>
<section class="panel" id="app" aria-live="polite"></section>
</main>
<script>
var app=document.getElementById('app');
var OPT=['Alterat','Contaminat','Adulterat'];
var CARDS=[
{e:'🍪',t:'Una galeta guardada en un lloc humit s\'ha enrancit.',a:0,w:['Ha canviat de sabor i d\'olor, però no s\'ha alterat cap altra cosa. Encara pot ser innocu.','No s\'hi ha detectat cap agent químic, físic ni biològic estrany.','Ningú hi ha afegit ni tret res a propòsit: no hi ha frau.']},
{e:'🥚',t:'Una maionesa amb Salmonella. Té bon aspecte, bona olor i bon gust.',a:1,w:['Un aliment alterat canvia d\'olor, color o textura. Aquí no es nota res.','Té un agent biològic (Salmonella) que pot provocar una malaltia de transmissió alimentària.','No hi ha frau: ningú l\'ha modificada de manera premeditada.']},
{e:'🥛',t:'Un venedor barreja la llet amb aigua per vendre\'n més quantitat.',a:2,w:['No ha canviat pel seu compte, per un mal emmagatzematge.','L\'aigua no és un agent contaminant perillós en aquest cas.','S\'ha modificat la composició de manera premeditada per guanyar diners. Això és adulterar.']},
{e:'🍣',t:'S\'injecta suc de remolatxa a la tonyina perquè sembli fresca.',a:2,w:['El color no ha canviat per l\'edat de l\'aliment, sinó per una mà humana.','No és una contaminació accidental: la substància s\'afegeix a propòsit.','Es fa un frau en afegir una substància. A més, pot causar al·lèrgies o intoleràncies.']},
{e:'🍌',t:'Un plàtan que fa dies que és a la panera s\'ha posat marró i tou.',a:0,w:['Han canviat el color i la textura (característiques organolèptiques). És un aliment alterat.','No hi ha cap agent estrany que l\'hagi contaminat.','Ningú l\'ha manipulat amb intenció de fer trampa.']},
{e:'🥗',t:'Al servir una amanida s\'hi troba un tros de vidre trencat.',a:1,w:['No és un canvi de l\'aliment sinó que s\'hi ha incorporat una cosa de fora.','El vidre és un agent físic estrany que ha entrat a l\'aliment. Contaminat.','No hi ha intenció de frau. Ha estat un accident.']},
{e:'🫒',t:'Oli de gira-sol barrejat amb oli d\'oliva i venut com a verge extra.',a:2,w:['L\'oli no s\'ha fet malbé per la conservació.','No s\'hi ha col·locat cap agent perillós, sinó que se n\'ha barrejat un altre.','Se n\'ha canviat la composició per enganyar el client. Aliment adulterat.']},
{e:'🐟',t:'Peix cru amb un paràsit de l\'anisakis.',a:1,w:['El peix pot semblar fresc. No ha canviat d\'olor ni de color.','L\'anisakis és un agent biològic estrany (paràsit) i pot provocar una infecció alimentària.','No hi ha res afegit a propòsit per part del venedor.']},
{e:'🥩',t:'Carn picada amb restes de líquid de neteja després d\'una mala desinfecció.',a:1,w:['No ha canviat pel pas del temps o per la conservació: hi ha entrat una cosa de fora.','El líquid de neteja és un agent químic estrany a l\'aliment. Contaminat.','Ningú l\'ha manipulat a propòsit per treure\'n benefici. Ha estat un error.']},
{e:'🍞',t:'Una barra de pa oblidada durant dies s\'ha endurit i s\'ha assecat.',a:0,w:['Ha perdut qualitat i textura amb el temps: aliment alterat.','No s\'hi ha incorporat cap agent químic, físic ni biològic estrany.','Ningú n\'ha canviat la composició amb intenció fraudulenta.']},
{e:'🍯',t:'Es ven xarop de sucre com si fos mel pura.',a:2,w:['La mel no s\'ha fet malbé: és un producte diferent.','No s\'hi ha colat cap agent perillós; s\'ha afegit una altra substància.','Se n\'ha modificat la composició per enganyar el client, amb interès econòmic. Adulterat.']},
{e:'🥬',t:'Verdura amb restes de pesticida per sobre dels límits permesos.',a:1,w:['Pot semblar fresca: l\'aspecte no ha canviat.','El pesticida és un agent químic que ha arribat a l\'aliment. Contaminat.','No hi ha hagut una modificació premeditada per part del venedor.']},
{e:'🧀',t:'Un formatge guardat fora de la nevera fa olor agra i té la textura canviada.',a:0,w:['Han canviat l\'olor i la textura per una mala conservació. Alterat.','No s\'hi ha detectat cap agent estrany (encara que convé no menjar-lo).','Ningú l\'ha manipulat a propòsit.']},
{e:'🌭',t:'S\'afegeix colorant a un embotit vell perquè sembli fresc i més rosat.',a:2,w:['El color no ha canviat pel pas del temps, sinó per una addició humana.','El colorant s\'ha afegit expressament, no és una entrada accidental.','S\'ha afegit una substància per amagar un defecte i enganyar el consumidor. Adulterat.']}
];
var i=0,score=0,answered=false;
function show1(){
 if(i>=CARDS.length){var r=score/CARDS.length;app.innerHTML='<div class="end"><div class="big">'+(r>.7?'🏅':'📚')+'</div><h2>'+score+' / '+CARDS.length+'</h2><p>'+(r>.7?'Molt bé! Domines la diferència entre alterat, contaminat i adulterat.':'Repassa les tres definicions i torna-ho a provar.')+'</p><button class="next" id="rs">Torna a jugar</button></div>';document.getElementById('rs').onclick=function(){i=0;score=0;show1()};return}
 var c=CARDS[i];answered=false;
 app.innerHTML='<div class="bar"><span>Aliment '+(i+1)+' de '+CARDS.length+'</span><span>Punts: '+score+'</span></div><div class="big">'+c.e+'</div><p class="q">'+c.t+'</p><div class="opts">'+OPT.map(function(o,k){return '<button data-k="'+k+'">'+o+'</button>'}).join('')+'</div><div class="fb" id="fb"></div>';
 app.querySelectorAll('.opts button').forEach(function(b){b.onclick=function(){pick(+b.dataset.k)}});
}
function pick(k){
 if(answered)return;answered=true;var c=CARDS[i],ok=k===c.a;if(ok)score++;
 app.querySelectorAll('.opts button').forEach(function(b,n){b.disabled=true;if(n===c.a){b.style.background='var(--okbg)';b.style.borderColor='var(--ok)'}else if(n===k){b.style.background='var(--kobg)';b.style.borderColor='var(--ko)'}});
 var h='<div class="verdict">'+(ok?'✅ Correcte!':'❌ No exactament. La resposta és: '+OPT[c.a])+'</div>';
 OPT.forEach(function(o,n){h+='<div class="'+(n===c.a?'good':(n===k?'bad':''))+'"><b>'+(n===c.a?'✅ ':'❌ ')+o+':</b> '+c.w[n]+'</div>'});
 document.getElementById('fb').innerHTML=h+'<div><button class="next" id="nx">'+(i===CARDS.length-1?'Veure resultat':'Següent')+'</button></div>';
 document.getElementById('nx').onclick=function(){i++;show1()};
}
var TILES=[
{e:'🐔',t:'Pollastre cru damunt d\'un bol d\'amanida',err:1,w:'Error: contaminació creuada. Els sucs de la carn crua poden contaminar l\'amanida, que es menja sense cuinar.'},
{e:'🧼',t:'El cuiner es renta les mans després de mocar-se',err:0,w:'Correcte: és una bona pràctica d\'higiene personal, i cal que sigui un hàbit.'},
{e:'🌡️',t:'Cambra frigorífica a 12 °C',err:1,w:'Error: és una incidència d\'infraestructura. Els equips de fred han de tenir la temperatura adequada.'},
{e:'🏷️',t:'Tàper amb nom i data de caducitat',err:0,w:'Correcte: els aliments han d\'estar ben identificats i emmagatzemats en envasos adequats.'},
{e:'🗑️',t:'Contenidor amb tapa i pedal',err:0,w:'Correcte: es compleix la bona pràctica de gestió de residus. Sense tapa ni pedal seria una incidència.'},
{e:'📦',t:'Caixes de verdura directament a terra',err:1,w:'Error: contaminació i males pràctiques d\'emmagatzematge. Cal separar els aliments del terra.'},
{e:'🔪',t:'La mateixa taula per a carn crua i verdura',err:1,w:'Error: contaminació creuada. Cal fer servir utillatge i superfícies separats.'},
{e:'🥚',t:'Maionesa casolana 3 h sobre el marbre',err:1,w:'Error: mala temperatura de conservació. Hi poden créixer microorganismes i causar una infecció.'},
{e:'📋',t:'Registre de temperatures de les cambres al dia',err:0,w:'Correcte: és un sistema d\'autocontrol. Els inspectors en demanen la documentació.'},
{e:'🥛',t:'Llet a la nevera amb etiqueta i data',err:0,w:'Correcte: emmagatzemada a la temperatura idònia i ben identificada.'},
{e:'🐛',t:'Rastres de plagues a l\'obrador',err:1,w:'Error: falla el Pla de plagues, un dels sistemes d\'autocontrol que revisen els inspectors.'},
{e:'📑',t:'Albarans dels proveïdors guardats i ordenats',err:0,w:'Correcte: permeten la traçabilitat i demostrar el Pla de proveïdors.'},
{e:'🎓',t:'Dos treballadors nous sense cap formació en higiene',err:1,w:'Error: falta el Pla de formació del personal manipulador.'},
{e:'🥜',t:'El cambrer no sap si el postre porta fruits secs',err:1,w:'Error: falla el Pla d\'al·lergògens. Una al·lèrgia pot ser greu.'},
{e:'🧽',t:'Pla de neteja i desinfecció signat i aplicat',err:0,w:'Correcte: és un sistema d\'autocontrol que els inspectors comproven.'},
{e:'🥶',t:'Carn crua i cuinats separats, cadascun en el seu envàs tapat',err:0,w:'Correcte: evita la contaminació creuada a la nevera.'}
];
var sel={},checked=false;
function show2(){
 app.innerHTML='<p class="q">Toca tots els elements que siguin un ERROR i després prem «Comprova».</p><div class="grid">'+TILES.map(function(t,k){return '<button class="tile" data-k="'+k+'" aria-pressed="false"><span class="e">'+t.e+'</span><span class="t">'+t.t+'</span></button>'}).join('')+'</div><div class="legend"><span>🟩 Encert</span><span>🟥 Falsa alarma (no era un error)</span><span>🟧 Error que no has detectat</span></div><button class="next" id="ck">Comprova</button> <button class="next" id="rs2" style="background:var(--mute)">Reinicia</button><div class="fb" id="fb2"></div>';
 sel={};checked=false;
 app.querySelectorAll('.tile').forEach(function(b){b.onclick=function(){if(checked)return;var k=b.dataset.k;sel[k]=!sel[k];b.setAttribute('aria-pressed',sel[k]?'true':'false')}});
 document.getElementById('ck').onclick=check;document.getElementById('rs2').onclick=show2;
}
function check(){
 if(checked)return;checked=true;var hit=0,tot=0;
 app.querySelectorAll('.tile').forEach(function(b){var k=b.dataset.k,t=TILES[k],s=!!sel[k],cls,tag;
  if(t.err&&s){cls='good';tag='🟩 Error detectat';hit++}else if(t.err&&!s){cls='miss';tag='🟧 No l\'has detectat'}else if(!t.err&&s){cls='bad';tag='🟥 Aquí no hi havia error'}else{cls='';tag='✔ Correcte, no era un error'}
  if(t.err)tot++;
  b.classList.remove('good','bad','miss');if(cls)b.classList.add(cls);b.setAttribute('aria-pressed','false');
  b.insertAdjacentHTML('beforeend','<span class="r">'+tag+'</span>');
  t.tag=tag;t.cls=cls;});
 var fp=Object.keys(sel).filter(function(k){return sel[k]&&!TILES[k].err}).length;
 var h='<div class="verdict">Has trobat '+hit+' de '+tot+' errors'+(fp?' i has marcat '+fp+' element(s) que eren correctes.':'.')+'</div>';
 TILES.forEach(function(t){h+='<div class="'+(t.cls||'')+'"><b>'+t.e+' '+t.t+':</b> '+t.w+'</div>'});
 document.getElementById('fb2').innerHTML=h;
}
var R=[
{n:'🔤 Sigles i organismes',p:[['FAO','Organització de les Nacions Unides per a l\'Alimentació i l\'Agricultura'],['OMS','Organització Mundial de la Salut'],['AESAN','Agència Espanyola de Consum, Seguretat Alimentària i Nutrició'],['ACSA','Agència Catalana de Seguretat Alimentària'],['BOA','Brot d\'origen alimentari'],['ETA','Malaltia de transmissió alimentària']]},
{n:'🧠 Conceptes bàsics',p:[['Seguretat alimentària','Accés a aliments innocus, nutritius i en quantitat suficient'],['Higiene alimentària','Condicions i mesures perquè l\'aliment sigui innocu i comestible en tota la cadena'],['Bones pràctiques','Actuacions correctes en el treball per garantir qualitat i innocuïtat'],['Traçabilitat','Possibilitat de trobar i seguir el rastre de l\'aliment en totes les etapes'],['Aliment alterat','Ha canviat les característiques organolèptiques, la composició o el valor nutritiu'],['Aliment contaminat','Ha incorporat un agent estrany (químic, físic o biològic)'],['Aliment adulterat','Se n\'ha afegit o tret una substància de manera premeditada i fraudulenta'],['Codex alimentarius','Normes alimentàries internacionals de la FAO i l\'OMS']]},
{n:'🔬 Perills i inspeccions',p:[['Infecció alimentària','Trastorn causat per microorganismes vius (bacteri, virus o paràsit)'],['Intoxicació alimentària','Trastorn causat per toxines presents a l\'aliment; apareix a les poques hores'],['Brot d\'origen alimentari','Dues o més persones amb els mateixos símptomes pels mateixos aliments'],['Inspecció de sanitat','Auditoria que valora infraestructura, bones pràctiques i autocontrol'],['Registre sanitari','Inscripció obligatòria de les empreses alimentàries; consta a l\'etiqueta'],['Característiques organolèptiques','Les que es perceben amb els sentits: gust, textura, olor i color']]}
];
var L=null,dn=0,er=0;
function show3(r){
 var d=R[r],right=d.p.map(function(x,k){return k}).sort(function(){return Math.random()-.5});L=null;dn=0;er=0;
 app.innerHTML='<div class="bar"><span>Ronda '+(r+1)+' de '+R.length+': '+d.n+'</span><span id="sc">Parelles: 0/'+d.p.length+' · Errors: 0</span></div><p class="q">Toca un terme i, després, la seva parella.</p><div class="two"><div class="col">'+d.p.map(function(x,k){return '<button class="m" data-s="l" data-k="'+k+'">'+x[0]+'</button>'}).join('')+'</div><div class="col">'+right.map(function(k){return '<button class="m sm" data-s="r" data-k="'+k+'">'+d.p[k][1]+'</button>'}).join('')+'</div></div><div class="fb" id="fb3"></div>';
 var fb=document.getElementById('fb3'),sc=document.getElementById('sc');
 app.querySelectorAll('.m').forEach(function(b){b.onclick=function(){
  if(b.classList.contains('good'))return;var k=+b.dataset.k;
  if(b.dataset.s==='l'){app.querySelectorAll('.m[data-s="l"]').forEach(function(x){x.setAttribute('aria-pressed','false')});L=k;b.setAttribute('aria-pressed','true');return}
  if(L===null){fb.innerHTML='<div class="miss">Tria primer un terme de l\'esquerra.</div>';return}
  var lb=app.querySelector('.m[data-s="l"][data-k="'+L+'"]');
  if(k===L){lb.classList.add('good');b.classList.add('good');lb.setAttribute('aria-pressed','false');dn++;L=null;fb.innerHTML='<div class="good"><b>✅ Correcte:</b> '+d.p[k][0]+' → '+d.p[k][1]+'</div>'}
  else{er++;b.classList.add('bad');setTimeout(function(){b.classList.remove('bad')},900);fb.innerHTML='<div class="bad"><b>❌ Incorrecte:</b> «'+d.p[L][0]+'» no correspon a aquesta definició. Aquesta definició pertany a «'+d.p[k][0]+'».</div>'}
  sc.textContent='Parelles: '+dn+'/'+d.p.length+' · Errors: '+er;
  if(dn===d.p.length){var last=r===R.length-1;fb.innerHTML+='<div class="verdict">🎉 Ronda completada amb '+er+' error(s).</div><div><button class="next" id="nx3">'+(last?'Torna a començar':'Ronda següent')+'</button></div>';document.getElementById('nx3').onclick=function(){show3(last?0:r+1)}}
 }});
}
function tab(n){[1,2,3].forEach(function(m){document.getElementById('t'+m).setAttribute('aria-selected',m===n)});if(n===1){i=0;score=0;show1()}else if(n===2)show2();else show3(0)}
document.getElementById('t1').onclick=function(){tab(1)};
document.getElementById('t2').onclick=function(){tab(2)};
document.getElementById('t3').onclick=function(){tab(3)};
show1();
</script>
</body>
</html>
