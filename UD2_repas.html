<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repàs UD1.1: Seguretat i higiene alimentàries</title>
<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#16303d;--mute:#5b7482;--line:#cbd9e1;--brand:#0e6e8c;--ok:#1b7f4b;--okbg:#dff3e7;--ko:#b3261e;--kobg:#fbe3e1;--warn:#9a5b00;--warnbg:#fdf0d5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1e26;--card:#182b36;--ink:#e6f0f5;--mute:#93aebb;--line:#2b4655;--brand:#4fc3e3;--ok:#5fd394;--okbg:#153a28;--ko:#ff8a80;--kobg:#42201e;--warn:#f5c26b;--warnbg:#3d2f10}}
:root[data-theme="dark"]{--bg:#0f1e26;--card:#182b36;--ink:#e6f0f5;--mute:#93aebb;--line:#2b4655;--brand:#4fc3e3;--ok:#5fd394;--okbg:#153a28;--ko:#ff8a80;--kobg:#42201e;--warn:#f5c26b;--warnbg:#3d2f10}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;line-height:1.45}
main{max-width:900px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.65rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 16px}
nav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
nav button{flex:1;min-width:140px;padding:11px 8px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
nav button[aria-selected="true"]{border-color:var(--brand);background:var(--brand);color:#fff}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.bar{display:flex;justify-content:space-between;color:var(--mute);font-size:.95rem;margin-bottom:8px;gap:8px}
.big{font-size:5rem;text-align:center;line-height:1.1;margin:6px 0}
.big.txt{font-size:3.4rem;font-weight:800;color:var(--brand);word-break:break-word}
.q{font-size:1.2rem;font-weight:700;text-align:center;margin:0 0 14px}
.info{background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:.93rem;color:var(--mute)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.opts button{padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:1rem;font-weight:700;cursor:pointer}
.opts button:disabled{cursor:default}
.fb{margin-top:14px;display:grid;gap:8px}
.fb div{padding:10px 12px;border-radius:10px;border-left:6px solid var(--line);background:var(--bg)}
.fb .good{background:var(--okbg);border-color:var(--ok)}
.fb .bad{background:var(--kobg);border-color:var(--ko)}
.fb .miss{background:var(--warnbg);border-color:var(--warn)}
.verdict{font-weight:700;font-size:1.1rem}
.next{margin-top:14px;padding:12px 22px;border:0;border-radius:12px;background:var(--brand);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.end{text-align:center;padding:20px 0}
.two{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
.col{display:grid;gap:8px;align-content:start}
.m{padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;text-align:left}
.m.sm{font-weight:400;font-size:.93rem}
.m[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand) inset}
.m.good{background:var(--okbg);border-color:var(--ok);cursor:default}
.m.bad{background:var(--kobg);border-color:var(--ko)}
.seq{display:grid;gap:8px}
</style>
</head>
<body>
<main>
<h1>🧼 Repàs UD1.1: Seguretat i higiene alimentàries</h1>
<p class="sub">Quatre jocs per repassar la unitat. Després de cada resposta veuràs per què les altres són incorrectes.</p>
<nav role="tablist"><button role="tab" id="t1" aria-selected="true">1 · Vertader o fals</button><button role="tab" id="t2" aria-selected="false">2 · Completa la frase</button><button role="tab" id="t3" aria-selected="false">3 · Ordena</button><button role="tab" id="t4" aria-selected="false">4 · Qui és responsable?</button></nav>
<section class="panel" id="app" aria-live="polite"></section>
</main>
<script>
var app=document.getElementById('app');
function end(s,n,again){var r=s/n;app.innerHTML='<div class="end"><div class="big">'+(r>.7?'🏅':'📚')+'</div><h2>'+s+' / '+n+'</h2><p>'+(r>.7?'Molt bé! Ho domines.':'Repassa el tema i torna-ho a provar.')+'</p><button class="next" id="rs">Torna a jugar</button></div>';document.getElementById('rs').onclick=again}
function quiz(items,info,name){
 var i=0,s=0;
 (function go(){
  if(i>=items.length){end(s,items.length,function(){i=0;s=0;go()});return}
  var c=items[i],an=false;
  app.innerHTML=(info?'<div class="info">'+info+'</div>':'')+'<div class="bar"><span>'+name+' '+(i+1)+' de '+items.length+'</span><span>Punts: '+s+'</span></div><div class="big'+(c.txt?' txt':'')+'">'+c.e+'</div><p class="q">'+c.t+'</p><div class="opts">'+c.o.map(function(o,k){return '<button data-k="'+k+'">'+o+'</button>'}).join('')+'</div><div class="fb" id="fb"></div>';
  app.querySelectorAll('.opts button').forEach(function(b){b.onclick=function(){
   if(an)return;an=true;var k=+b.dataset.k,ok=k===c.a;if(ok)s++;
   app.querySelectorAll('.opts button').forEach(function(x,n){x.disabled=true;if(n===c.a){x.style.background='var(--okbg)';x.style.borderColor='var(--ok)'}else if(n===k){x.style.background='var(--kobg)';x.style.borderColor='var(--ko)'}});
   var h='<div class="verdict">'+(ok?'✅ Correcte!':'❌ No exactament. La resposta és: '+c.o[c.a])+'</div>';
   c.o.forEach(function(o,n){h+='<div class="'+(n===c.a?'good':(n===k?'bad':''))+'"><b>'+(n===c.a?'✅ ':'❌ ')+o+':</b> '+c.w[n]+'</div>'});
   document.getElementById('fb').innerHTML=h+'<div><button class="next" id="nx">'+(i===items.length-1?'Veure resultat':'Següent')+'</button></div>';
   document.getElementById('nx').onclick=function(){i++;go()};
  }});
 })();
}
function rel(R,r){
 var d=R[r],right=d.p.map(function(x,k){return k}).sort(function(){return Math.random()-.5}),L=null,dn=0,er=0;
 app.innerHTML='<div class="bar"><span>Ronda '+(r+1)+' de '+R.length+': '+d.n+'</span><span id="sc">Parelles: 0/'+d.p.length+' · Errors: 0</span></div><p class="q">Toca un terme i, després, la seva parella.</p><div class="two"><div class="col">'+d.p.map(function(x,k){return '<button class="m" data-s="l" data-k="'+k+'">'+x[0]+'</button>'}).join('')+'</div><div class="col">'+right.map(function(k){return '<button class="m sm" data-s="r" data-k="'+k+'">'+d.p[k][1]+'</button>'}).join('')+'</div></div><div class="fb" id="fb3"></div>';
 var fb=document.getElementById('fb3'),sc=document.getElementById('sc');
 app.querySelectorAll('.m').forEach(function(b){b.onclick=function(){
  if(b.classList.contains('good'))return;var k=+b.dataset.k;
  if(b.dataset.s==='l'){app.querySelectorAll('.m[data-s="l"]').forEach(function(x){x.setAttribute('aria-pressed','false')});L=k;b.setAttribute('aria-pressed','true');return}
  if(L===null){fb.innerHTML='<div class="miss">Tria primer un terme de l\'esquerra.</div>';return}
  var lb=app.querySelector('.m[data-s="l"][data-k="'+L+'"]');
  if(k===L){lb.classList.add('good');b.classList.add('good');lb.setAttribute('aria-pressed','false');dn++;L=null;fb.innerHTML='<div class="good"><b>✅ Correcte:</b> '+d.p[k][0]+' → '+d.p[k][1]+'</div>'}
  else{er++;b.classList.add('bad');setTimeout(function(){b.classList.remove('bad')},900);fb.innerHTML='<div class="bad"><b>❌ Incorrecte:</b> «'+d.p[L][0]+'» no correspon a aquesta opció. Aquesta opció pertany a «'+d.p[k][0]+'».</div>'}
  sc.textContent='Parelles: '+dn+'/'+d.p.length+' · Errors: '+er;
  if(dn===d.p.length){var last=r===R.length-1;fb.innerHTML+='<div class="verdict">🎉 Ronda completada amb '+er+' error(s).</div><div><button class="next" id="nx3">'+(last?'Torna a començar':'Ronda següent')+'</button></div>';document.getElementById('nx3').onclick=function(){rel(R,last?0:r+1)}}
 }});
}
function mk(e,t,opts,desc,a,why,txt){return {e:e,t:t,txt:txt,o:opts,a:opts.indexOf(a),w:opts.map(function(x){return x===a?why:desc(x)})}}
function shuf(a){return a.slice().sort(function(){return Math.random()-.5})}

var DEF={"innocu": "que no causa danys a la salut", "alterat": "que ha canviat les característiques organolèptiques, la composició o el valor nutritiu", "contaminat": "que ha incorporat un agent estrany (químic, físic o biològic)", "adulterat": "que s'hi ha afegit o tret una substància de forma premeditada", "traçabilitat": "poder seguir el rastre de l'aliment per tota la cadena", "infecció": "trastorn causat per microorganismes vius", "intoxicació": "trastorn causat per toxines; apareix a les poques hores", "brot": "dues o més persones amb els mateixos símptomes pels mateixos aliments", "bones pràctiques": "actuacions correctes en el treball per garantir qualitat i innocuïtat", "autocontrol": "sistemes de l'empresa per controlar els seus perills (formació, plagues, neteja...)", "infraestructura": "l'estat de parets, sostres, paviments, equips i utillatge", "organolèptiques": "les que es perceben amb els sentits", "registre sanitari": "inscripció obligatòria de les empreses alimentàries", "higiene alimentària": "condicions i mesures perquè l'aliment sigui innocu i comestible"};
var TF=[["La seguretat alimentària només té en compte que els aliments siguin innocus.", false, "Falta alguna cosa: ha de garantir aliments innocus, nutritius i en quantitat suficient."], ["Un aliment innocu és el que no causa danys a la salut pública.", true, "Innocu vol dir que no fa mal a la salut."], ["Un aliment alterat és sempre perillós per a la salut.", false, "No necessàriament: una galeta enrancida està alterada però no té per què ser perillosa."], ["Un aliment contaminat pot tenir bon aspecte i bona olor.", true, "La maionesa amb Salmonella, per exemple, sembla normal."], ["Adulterar un aliment és una acció premeditada i amb finalitat fraudulenta.", true, "Es fa a propòsit, normalment per interès econòmic (llet amb aigua)."], ["La traçabilitat permet seguir el rastre d'un aliment per totes les etapes de la cadena.", true, "I per això el risc es pot gestionar més ràpid."], ["Els tres punts clau d'una inspecció de sanitat són preu, qualitat i servei.", false, "Són infraestructura, bones pràctiques de manipulació i sistemes d'autocontrol."], ["Una infecció alimentària la causen toxines presents a l'aliment.", false, "Això és una intoxicació. La infecció la causen microorganismes vius."], ["Els símptomes d'una intoxicació alimentària apareixen a les poques hores.", true, "Les toxines actuen ràpid, mentre que la infecció té període d'incubació."], ["Un brot d'origen alimentari és quan una sola persona té símptomes.", false, "Per ser un brot calen dues o més persones amb els mateixos símptomes."], ["Davant la sospita d'un brot, la primera acció és informar l'Autoritat Sanitària.", true, "Després es recull informació, es retira el producte i s'atén el públic."], ["Les dones embarassades formen part de la població de risc.", true, "Igual que els nens, les persones grans, els turistes i les persones malaltes."], ["El Registre Sanitari només cal per a les empreses grans.", false, "Totes les empreses alimentàries hi han d'estar inscrites."], ["«Consumir preferentment» indica fins quan l'aliment és segur.", false, "Indica qualitat. La data de caducitat és la que indica seguretat."], ["En restauració també cal informar dels al·lèrgens dels aliments sense envasar.", true, "Per escrit: carta, cartell o etiqueta."], ["La responsabilitat de la seguretat alimentària és només de les institucions públiques.", false, "És compartida: empreses, institucions i consumidors."], ["A Espanya els resultats de les inspeccions de sanitat són públics.", false, "Són privats. Al Regne Unit i als Estats Units són públics."]];
var G1=TF.map(function(x){return {e:'🧐',t:x[0],o:['Vertader','Fals'],a:x[1]?0:1,w:x[1]?[x[2],'No: aquesta afirmació és certa. '+x[2]]:['No: aquesta afirmació és falsa.',x[2]]}});
var FR=[["Un aliment ____ ha incorporat un agent estrany, com la Salmonella.", "contaminat", ["contaminat", "alterat", "adulterat", "innocu"]], ["Un aliment ____ s'ha modificat a propòsit per enganyar el consumidor.", "adulterat", ["adulterat", "alterat", "contaminat", "innocu"]], ["Un aliment ____ no causa danys a la salut pública.", "innocu", ["innocu", "alterat", "adulterat", "contaminat"]], ["La ____ permet seguir el rastre d'un aliment per totes les etapes.", "traçabilitat", ["traçabilitat", "infraestructura", "autocontrol", "higiene alimentària"]], ["Una ____ alimentària la causen microorganismes vius.", "infecció", ["infecció", "intoxicació", "traçabilitat", "brot"]], ["Una ____ alimentària apareix a les poques hores i la causen toxines.", "intoxicació", ["intoxicació", "infecció", "brot", "alterat"]], ["Un ____ és un incident amb dues o més persones amb els mateixos símptomes.", "brot", ["brot", "infecció", "intoxicació", "autocontrol"]], ["Les ____ són actuacions correctes que s'han de convertir en un hàbit.", "bones pràctiques", ["bones pràctiques", "organolèptiques", "infraestructura", "autocontrol"]], ["Una inspecció valora la infraestructura, les bones pràctiques i l'____.", "autocontrol", ["autocontrol", "traçabilitat", "registre sanitari", "higiene alimentària"]], ["El gust, el color, l'olor i la textura són característiques ____.", "organolèptiques", ["organolèptiques", "innocu", "contaminat", "autocontrol"]], ["Totes les empreses alimentàries han d'estar inscrites al ____.", "registre sanitari", ["registre sanitari", "autocontrol", "brot", "traçabilitat"]], ["L'____ alimentària són condicions i mesures perquè l'aliment sigui innocu i comestible.", "higiene alimentària", ["higiene alimentària", "traçabilitat", "infecció", "brot"]]];
var G2=FR.map(function(x){return mk('✏️',x[0],x[2],function(o){return 'Aquí no encaixa: «'+o+'» significa «'+DEF[o]+'».'},x[1],'Encaixa: «'+x[1]+'» significa «'+DEF[x[1]]+'».')});
var RS=[["Aplicar les bones pràctiques en cada fase del procés", 0], ["Redactar la normativa de seguretat alimentària", 1], ["Llegir les etiquetes dels productes", 2], ["Supervisar que la normativa s'apliqui", 1], ["Mantenir els sistemes d'autocontrol de l'establiment", 0], ["Conservar i preparar bé els aliments a casa", 2], ["Fer inspeccions de sanitat", 1], ["Exigir salubritat i qualitat", 2], ["Informar el personal i col·laborar amb l'Autoritat Sanitària en un brot", 0]],OP=['🏭 Empreses i manipuladors','🏛️ Institucions públiques','🧑 Consumidors'];
var OD=['Les empreses i les persones del procés productiu apliquen les bones pràctiques i la normativa.','Redacten la normativa i en supervisen l\'aplicació (Comissió Europea, Estats membres, comunitats autònomes i entitats locals).','S\'informen, exigeixen salubritat, llegeixen les etiquetes i conserven i preparen bé els aliments.'];
var G4=RS.map(function(x){return {e:'👥',t:'Qui s\'encarrega de: «'+x[0].toLowerCase()+'»?',o:OP,a:x[1],w:OP.map(function(o,k){return k===x[1]?OD[k]:'No: '+OD[k]})}});
var OR=[{"n": "🔗 La cadena alimentària", "i": [["Producció", "Camp i granja: l'origen de l'aliment"], ["Transport", "Distribució dels aliments"], ["Indústria", "Elaboració i emmagatzematge"], ["Restauració", "Comerç i servei"], ["Consumidor", "Conservació i preparació a casa"]]}, {"n": "🚨 Protocol davant un brot", "i": [["Informar el personal", "Perquè col·labori i doni tota la informació"], ["Recollir informació", "Exposats, manipuladors, instal·lacions i registres"], ["Retirar el producte", "Es retira del mercat i s'analitza l'agent causant"], ["Atendre el públic", "Contacte amb afectats, sense difondre dades abans de l'informe oficial"]]}, {"n": "🏛️ Normativa: de més ampli a més local", "i": [["Codex alimentarius", "Normes internacionals de la FAO i l'OMS"], ["Reglament (CE) 852/2004", "Normativa europea sobre higiene dels productes alimentaris"], ["AESAN", "Agència estatal de seguretat alimentària"], ["ACSA", "Agència catalana de seguretat alimentària"]]}];
function ordena(r){
 var d=OR[r],k=0,er=0,n=d.i.length,order=shuf(d.i.map(function(x,j){return j}));
 app.innerHTML='<div class="bar"><span>Ronda '+(r+1)+' de '+OR.length+': '+d.n+'</span><span id="sc">Ordenats: 0/'+n+' · Errors: 0</span></div><p class="q">Toca els elements en l\'ordre correcte.</p><div class="seq">'+order.map(function(j){return '<button class="m" data-j="'+j+'">'+d.i[j][0]+'</button>'}).join('')+'</div><div class="fb" id="fbo"></div>';
 var fb=document.getElementById('fbo'),sc=document.getElementById('sc');
 app.querySelectorAll('.m').forEach(function(b){b.onclick=function(){
  if(b.classList.contains('good'))return;var j=+b.dataset.j;
  if(j===k){b.classList.add('good');b.textContent=(k+1)+'. '+d.i[j][0]+' — '+d.i[j][1];k++;fb.innerHTML='<div class="good"><b>✅ Correcte:</b> '+d.i[j][0]+'</div>'}
  else{er++;b.classList.add('bad');setTimeout(function(){b.classList.remove('bad')},900);fb.innerHTML='<div class="bad"><b>❌ «'+d.i[j][0]+'» encara no toca.</b> Això és: '+d.i[j][1]+'. Busca el pas que és: '+d.i[k][1]+'.</div>'}
  sc.textContent='Ordenats: '+k+'/'+n+' · Errors: '+er;
  if(k===n){var last=r===OR.length-1;fb.innerHTML+='<div class="verdict">🎉 Ronda completada amb '+er+' error(s).</div><div><button class="next" id="nxo">'+(last?'Torna a començar':'Ronda següent')+'</button></div>';document.getElementById('nxo').onclick=function(){ordena(last?0:r+1)}}
 }});
}
var TABS=[function(){quiz(G1,'Decideix si l\'afirmació és vertadera o falsa.','Afirmació')},function(){quiz(G2,'Tria la paraula que completa la frase.','Frase')},function(){ordena(0)},function(){quiz(G4,'Empreses, institucions públiques o consumidors?','Tasca')}];
function tab(n){for(var m=1;m<=4;m++)document.getElementById("t"+m).setAttribute("aria-selected",m===n);TABS[n-1]()}
for(var m=1;m<=4;m++)(function(m){document.getElementById("t"+m).onclick=function(){tab(m)}})(m);
tab(1);</script>
</body>
</html>
