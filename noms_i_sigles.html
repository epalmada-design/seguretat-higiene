<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noms i sigles de la seguretat alimentària</title>
<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#16303d;--mute:#5b7482;--line:#cbd9e1;--brand:#0e6e8c;--ok:#1b7f4b;--okbg:#dff3e7;--ko:#b3261e;--kobg:#fbe3e1;--warn:#9a5b00;--warnbg:#fdf0d5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1e26;--card:#182b36;--ink:#e6f0f5;--mute:#93aebb;--line:#2b4655;--brand:#4fc3e3;--ok:#5fd394;--okbg:#153a28;--ko:#ff8a80;--kobg:#42201e;--warn:#f5c26b;--warnbg:#3d2f10}}
:root[data-theme="dark"]{--bg:#0f1e26;--card:#182b36;--ink:#e6f0f5;--mute:#93aebb;--line:#2b4655;--brand:#4fc3e3;--ok:#5fd394;--okbg:#153a28;--ko:#ff8a80;--kobg:#42201e;--warn:#f5c26b;--warnbg:#3d2f10}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;line-height:1.45}
main{max-width:900px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.65rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 16px}
nav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
nav button{flex:1;min-width:140px;padding:11px 8px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
nav button[aria-selected="true"]{border-color:var(--brand);background:var(--brand);color:#fff}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.bar{display:flex;justify-content:space-between;color:var(--mute);font-size:.95rem;margin-bottom:8px;gap:8px}
.big{font-size:5rem;text-align:center;line-height:1.1;margin:6px 0}
.big.txt{font-size:3.4rem;font-weight:800;color:var(--brand);word-break:break-word}
.q{font-size:1.2rem;font-weight:700;text-align:center;margin:0 0 14px}
.info{background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:.93rem;color:var(--mute)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.opts button{padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:1rem;font-weight:700;cursor:pointer}
.opts button:disabled{cursor:default}
.fb{margin-top:14px;display:grid;gap:8px}
.fb div{padding:10px 12px;border-radius:10px;border-left:6px solid var(--line);background:var(--bg)}
.fb .good{background:var(--okbg);border-color:var(--ok)}
.fb .bad{background:var(--kobg);border-color:var(--ko)}
.fb .miss{background:var(--warnbg);border-color:var(--warn)}
.verdict{font-weight:700;font-size:1.1rem}
.next{margin-top:14px;padding:12px 22px;border:0;border-radius:12px;background:var(--brand);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.end{text-align:center;padding:20px 0}
.two{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
.col{display:grid;gap:8px;align-content:start}
.m{padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;text-align:left}
.m.sm{font-weight:400;font-size:.93rem}
.m[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand) inset}
.m.good{background:var(--okbg);border-color:var(--ok);cursor:default}
.m.bad{background:var(--kobg);border-color:var(--ko)}
.seq{display:grid;gap:8px}
</style>
</head>
<body>
<main>
<h1>🔤 Noms i sigles de la seguretat alimentària</h1>
<p class="sub">Quatre jocs per no confondre mai ONU, OMS, FAO, ACSA, RASFF... Després de cada resposta veuràs per què les altres opcions són incorrectes.</p>
<nav role="tablist"><button role="tab" id="t1" aria-selected="true">1 · Sigla → nom</button><button role="tab" id="t2" aria-selected="false">2 · Nom → sigla</button><button role="tab" id="t3" aria-selected="false">3 · Relaciona</button><button role="tab" id="t4" aria-selected="false">4 · Quina sigla és?</button></nav>
<section class="panel" id="app" aria-live="polite"></section>
</main>
<script>
var app=document.getElementById('app');
function end(s,n,again){var r=s/n;app.innerHTML='<div class="end"><div class="big">'+(r>.7?'🏅':'📚')+'</div><h2>'+s+' / '+n+'</h2><p>'+(r>.7?'Molt bé! Ho domines.':'Repassa el tema i torna-ho a provar.')+'</p><button class="next" id="rs">Torna a jugar</button></div>';document.getElementById('rs').onclick=again}
function quiz(items,info,name){
 var i=0,s=0;
 (function go(){
  if(i>=items.length){end(s,items.length,function(){i=0;s=0;go()});return}
  var c=items[i],an=false;
  app.innerHTML=(info?'<div class="info">'+info+'</div>':'')+'<div class="bar"><span>'+name+' '+(i+1)+' de '+items.length+'</span><span>Punts: '+s+'</span></div><div class="big'+(c.txt?' txt':'')+'">'+c.e+'</div><p class="q">'+c.t+'</p><div class="opts">'+c.o.map(function(o,k){return '<button data-k="'+k+'">'+o+'</button>'}).join('')+'</div><div class="fb" id="fb"></div>';
  app.querySelectorAll('.opts button').forEach(function(b){b.onclick=function(){
   if(an)return;an=true;var k=+b.dataset.k,ok=k===c.a;if(ok)s++;
   app.querySelectorAll('.opts button').forEach(function(x,n){x.disabled=true;if(n===c.a){x.style.background='var(--okbg)';x.style.borderColor='var(--ok)'}else if(n===k){x.style.background='var(--kobg)';x.style.borderColor='var(--ko)'}});
   var h='<div class="verdict">'+(ok?'✅ Correcte!':'❌ No exactament. La resposta és: '+c.o[c.a])+'</div>';
   c.o.forEach(function(o,n){h+='<div class="'+(n===c.a?'good':(n===k?'bad':''))+'"><b>'+(n===c.a?'✅ ':'❌ ')+o+':</b> '+c.w[n]+'</div>'});
   document.getElementById('fb').innerHTML=h+'<div><button class="next" id="nx">'+(i===items.length-1?'Veure resultat':'Següent')+'</button></div>';
   document.getElementById('nx').onclick=function(){i++;go()};
  }});
 })();
}
function rel(R,r){
 var d=R[r],right=d.p.map(function(x,k){return k}).sort(function(){return Math.random()-.5}),L=null,dn=0,er=0;
 app.innerHTML='<div class="bar"><span>Ronda '+(r+1)+' de '+R.length+': '+d.n+'</span><span id="sc">Parelles: 0/'+d.p.length+' · Errors: 0</span></div><p class="q">Toca un terme i, després, la seva parella.</p><div class="two"><div class="col">'+d.p.map(function(x,k){return '<button class="m" data-s="l" data-k="'+k+'">'+x[0]+'</button>'}).join('')+'</div><div class="col">'+right.map(function(k){return '<button class="m sm" data-s="r" data-k="'+k+'">'+d.p[k][1]+'</button>'}).join('')+'</div></div><div class="fb" id="fb3"></div>';
 var fb=document.getElementById('fb3'),sc=document.getElementById('sc');
 app.querySelectorAll('.m').forEach(function(b){b.onclick=function(){
  if(b.classList.contains('good'))return;var k=+b.dataset.k;
  if(b.dataset.s==='l'){app.querySelectorAll('.m[data-s="l"]').forEach(function(x){x.setAttribute('aria-pressed','false')});L=k;b.setAttribute('aria-pressed','true');return}
  if(L===null){fb.innerHTML='<div class="miss">Tria primer un terme de l\'esquerra.</div>';return}
  var lb=app.querySelector('.m[data-s="l"][data-k="'+L+'"]');
  if(k===L){lb.classList.add('good');b.classList.add('good');lb.setAttribute('aria-pressed','false');dn++;L=null;fb.innerHTML='<div class="good"><b>✅ Correcte:</b> '+d.p[k][0]+' → '+d.p[k][1]+'</div>'}
  else{er++;b.classList.add('bad');setTimeout(function(){b.classList.remove('bad')},900);fb.innerHTML='<div class="bad"><b>❌ Incorrecte:</b> «'+d.p[L][0]+'» no correspon a aquesta opció. Aquesta opció pertany a «'+d.p[k][0]+'».</div>'}
  sc.textContent='Parelles: '+dn+'/'+d.p.length+' · Errors: '+er;
  if(dn===d.p.length){var last=r===R.length-1;fb.innerHTML+='<div class="verdict">🎉 Ronda completada amb '+er+' error(s).</div><div><button class="next" id="nx3">'+(last?'Torna a començar':'Ronda següent')+'</button></div>';document.getElementById('nx3').onclick=function(){rel(R,last?0:r+1)}}
 }});
}
function mk(e,t,opts,desc,a,why,txt){return {e:e,t:t,txt:txt,o:opts,a:opts.indexOf(a),w:opts.map(function(x){return x===a?why:desc(x)})}}
function shuf(a){return a.slice().sort(function(){return Math.random()-.5})}

var S=[["ONU", "Organització de les Nacions Unides", "Organització internacional de la qual depenen agències com la FAO i l'OMS."], ["OMS", "Organització Mundial de la Salut", "Agència de l'ONU per a la salut. Amb la FAO elabora el Codex alimentarius."], ["FAO", "Organització de les Nacions Unides per a l'Alimentació i l'Agricultura", "Agència de l'ONU per a l'alimentació. Amb l'OMS elabora el Codex alimentarius."], ["UE", "Unió Europea", "Estableix normativa de seguretat alimentària i fixa les quantitats màximes de substàncies químiques als aliments."], ["CE", "Comunitat Europea", "Apareix als reglaments (com el Reglament (CE) 852/2004) i a la marca d'identificació de les etiquetes."], ["AESAN", "Agència Espanyola de Consum, Seguretat Alimentària i Nutrició", "Organisme estatal: publica legislació i alertes alimentàries."], ["ACSA", "Agència Catalana de Seguretat Alimentària", "Coordina els departaments de la Generalitat amb els organismes estatals i europeus."], ["EFSA", "Autoritat Europea de Seguretat Alimentària", "Els seus comitès d'experts avaluen riscos alimentaris, com els de l'acrilamida."], ["RASFF", "Sistema d'Alerta Ràpida per a Aliments i Pinsos", "Eina de la UE perquè els països s'intercanviïn alertes de toxiinfeccions."], ["JECFA", "Comitè Mixt FAO/OMS d'Experts en Additius Alimentaris", "Avalua la innocuïtat dels additius i les quantitats permeses."], ["ETA", "Malaltia de transmissió alimentària", "Causada per la ingesta d'aliments contaminats (infecció o intoxicació)."], ["BOA", "Brot d'origen alimentari", "Dues o més persones amb els mateixos símptomes per haver ingerit els mateixos aliments."], ["PCB", "Bifenils policlorats", "Contaminants mediambientals químics presents a la cadena alimentària."]];
function others(i,n){var r=[];S.forEach(function(x,j){if(j!==i)r.push(j)});r=shuf(r).slice(0,n);return r}
function opts4(i,f){var o=others(i,3).map(function(j){return S[j][f]});o.push(S[i][f]);return shuf(o)}
function byName(n){return S.filter(function(x){return x[1]===n})[0]}
function bySig(n){return S.filter(function(x){return x[0]===n})[0]}
function G1(){return S.map(function(x,i){return mk(x[0],'Què vol dir aquesta sigla?',opts4(i,1),function(o){var y=byName(o);return 'Això és «'+y[0]+'»: '+y[2]},x[1],x[2],true)})}
function G2(){return S.map(function(x,i){return mk('🏷️',x[1],opts4(i,0),function(o){var y=bySig(o);return '«'+o+'» vol dir '+y[1]+'.'},x[0],x[2])})}
function G4(){return S.map(function(x,i){return mk('🔎','Quina sigla és? '+x[2],opts4(i,0),function(o){var y=bySig(o);return '«'+o+'» és '+y[1]+': '+y[2]},x[0],'«'+x[0]+'» és '+x[1]+'.')})}
var R=[{n:'🌍 Organismes internacionals i europeus',p:[['ONU','Organització de les Nacions Unides'],['OMS','Organització Mundial de la Salut'],['FAO','Organització de les Nacions Unides per a l\'Alimentació i l\'Agricultura'],['UE','Unió Europea'],['CE','Comunitat Europea']]},
{n:'🏛️ Agències i sistemes d\'alerta',p:[['AESAN','Agència Espanyola de Consum, Seguretat Alimentària i Nutrició'],['ACSA','Agència Catalana de Seguretat Alimentària'],['EFSA','Autoritat Europea de Seguretat Alimentària'],['RASFF','Sistema d\'Alerta Ràpida per a Aliments i Pinsos'],['JECFA','Comitè Mixt FAO/OMS d\'Experts en Additius Alimentaris']]},
{n:'🦠 Conceptes amb sigla',p:[['ETA','Malaltia de transmissió alimentària'],['BOA','Brot d\'origen alimentari'],['PCB','Bifenils policlorats']]}];
var TABS=[function(){quiz(G1(),'Pensa: quin nom hi ha darrere de cada sigla?','Sigla')},function(){quiz(G2(),'Pensa: quina sigla correspon a cada nom?','Nom')},function(){rel(R,0)},function(){quiz(G4(),'Descobreix la sigla a partir del que fa.','Pista')}];
function tab(n){for(var m=1;m<=4;m++)document.getElementById("t"+m).setAttribute("aria-selected",m===n);TABS[n-1]()}
for(var m=1;m<=4;m++)(function(m){document.getElementById("t"+m).onclick=function(){tab(m)}})(m);
tab(1);</script>
</body>
</html>
